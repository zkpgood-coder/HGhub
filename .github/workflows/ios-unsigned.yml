name: iOS unsigned IPA

on:
  workflow_dispatch:

concurrency:
  group: ios-unsigned
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  ios:
    name: iOS (unsigned ipa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios

      - name: 准备 xcodegen 与 cocoapods（镜像一般自带，缺了再装）
        run: |
          which xcodegen || brew install xcodegen
          which pod || brew install cocoapods

      - run: pnpm install --frozen-lockfile

      - name: 生成 iOS 工程
        run: pnpm tauri ios init --ci

      - name: 构建前端
        run: pnpm build

      - name: xcodebuild 未签名构建
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri/gen/apple
          PROJ="$(find . -maxdepth 1 -name '*.xcodeproj' | head -1)"
          echo "project: $PROJ"
          SCHEME="$(xcodebuild -list -project "$PROJ" -json | python3 -c "import json,sys; ss=json.load(sys.stdin)['project']['schemes']; print(next((s for s in ss if s.endswith('_iOS')), ss[0]))")"
          echo "scheme: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build

      - name: 打包未签名 IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APP="$(find src-tauri/gen/apple/build/Build/Products -name '*.app' -maxdepth 3 | head -1)"
          echo "app: $APP"
          test -n "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry artifacts/HGhub-unsigned.ipa Payload
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: artifacts/*
          if-no-files-found: error
